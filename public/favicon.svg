<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Deep Storybook Midnight Navy Canvas -->
    <linearGradient id="bg-canvas-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2638" />
      <stop offset="100%" stop-color="#0F1420" />
    </linearGradient>

    <!-- 'L': Warm Crimson / Terracotta Coral -->
    <linearGradient id="l-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#D9480F" />
    </linearGradient>

    <!-- 'U': Bright Amber / Golden Honey (Distinct & High Contrast) -->
    <linearGradient id="u-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="lu-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Folio Badge -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg-canvas-grad)" stroke="#2D3B55" stroke-width="2.5" />

  <g filter="url(#lu-shadow)">
    <!-- 'L' Letter (Terracotta Coral) - Clear, Solid, Independent Stroke -->
    <path d="M 28 26
             C 28 24, 30 22, 34 22
             L 42 22
             C 45 22, 47 24, 47 26
             L 47 78
             C 47 84, 52 86, 58 86
             L 66 86
             C 69 86, 71 88, 71 91
             L 71 93
             C 71 96, 69 98, 65 98
             L 34 98
             C 29 98, 26 95, 26 90
             L 26 29
             C 26 27, 27 26, 28 26 Z"
          fill="url(#l-coral)" />

    <!-- 'U' Letter (Luminous Gold / Amber) - Distinct Color & Crisp Separation -->
    <path d="M 58 34
             C 58 31, 60 29, 64 29
             L 72 29
             C 75 29, 78 31, 78 34
             L 78 68
             C 78 77, 83 83, 91 83
             C 99 83, 104 77, 104 68
             L 104 34
             C 104 31, 106 29, 110 29
             L 118 29
             C 121 29, 123 31, 123 34
             L 123 68
             C 123 86, 110 98, 91 98
             C 72 98, 58 86, 58 68
             Z"
          fill="url(#u-gold)" />

    <!-- Little Botanical Leaf on L (Fresh Emerald Accent) -->
    <path d="M 27 30
             C 18 26, 16 16, 21 11
             C 27 13, 31 22, 27 30 Z"
          fill="#10B981" />

    <!-- Guiding Sparkle Star inside U -->
    <path d="M 91 42
             C 91 45, 93 47, 96 47
             C 93 47, 91 49, 91 52
             C 91 49, 89 47, 86 47
             C 89 47, 91 45, 91 42 Z"
          fill="#FFFBEB" />
  </g>
</svg>
